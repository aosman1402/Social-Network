version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: social-backend
    ports:
      - "8081:8080"
    volumes:
      - ./backend/data:/app/data
    environment:
      - PORT=8080
      - DB_PATH=/app/data/social-network.db
      - MIGRATIONS_PATH=/app/pkg/db/migrations
    restart: unless-stopped
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: social-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
      - NEXT_PUBLIC_WS_URL=ws://backend:8080
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - social-network

networks:
  social-network:
    driver: bridge